[workspace]
resolver = "2"
members = [
    "crates/omnivore-core",
    "crates/omnivore-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The minimum toolchain that can build this workspace, driven by dependencies
# rather than by anything in our own source (askama and time both need 1.88).
# Declared so `cargo build` fails with "rustc X is not supported by the
# following packages" naming the culprit, instead of an obscure compile error —
# and so the Dockerfile's base image pin has something to track.
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "set-header"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# XML (JaCoCo / Kover report ingestion). quick-xml does not resolve external
# DTDs or entities, so it is not vulnerable to XXE; we additionally strip the
# DOCTYPE before parsing as defense in depth.
quick-xml = { version = "0.37", features = ["serialize"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Templating
askama = "0.15"

# HTTP client
reqwest = { version = "0.13", features = ["json", "query"] }

# Error handling
thiserror = "2"
anyhow = "1"

[profile.release]
strip = true
lto = true
