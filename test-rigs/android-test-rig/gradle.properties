# Required. AGP fails configuration outright — not with a warning — when the
# runtime classpath contains AndroidX artifacts and this is unset, and this rig
# depends on androidx.core, Compose, and Lifecycle.
#
# This file was previously untracked: the root .gitignore matched
# `gradle.properties` anywhere, not just at the repository root. The rig
# therefore could not be configured from a clean checkout, which nobody noticed
# because no CI job built it and the file existed on the machine that wrote it.
android.useAndroidX=true

# R classes contain only this module's resources rather than every dependency's.
# The default since AGP 8; stated explicitly so the rig's behaviour does not
# shift under it on an AGP upgrade.
android.nonTransitiveRClass=true

# The Android build plus the Omnivore ASM transform holds more in memory than
# Gradle's 512m default allows.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m

kotlin.code.style=official
