version: 2

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Coverage Plugin (Gradle)
  - package-ecosystem: "gradle"
    directory: "/coverage-plugin"
    schedule:
      interval: "weekly"
    ignore:
      # AGP is compileOnly and pinned to the oldest supported release (8.8.x)
      # on purpose: compiling against a newer one lets APIs slip in that crash
      # on older AGP at runtime. Newer AGP is exercised by the Android test rig
      # instead. 8.8.x patch updates are still proposed.
      - dependency-name: "com.android.tools.build:gradle"
        versions: [">= 8.9"]

  # Dashboard (Cargo/Rust)
  - package-ecosystem: "cargo"
    directory: "/dashboard"
    schedule:
      interval: "weekly"

  # KMP Test Rig (Gradle)
  - package-ecosystem: "gradle"
    directory: "/test-rigs/kmp-test-rig"
    schedule:
      interval: "weekly"

  # Android Test Rig (Gradle)
  - package-ecosystem: "gradle"
    directory: "/test-rigs/android-test-rig"
    schedule:
      interval: "weekly"
