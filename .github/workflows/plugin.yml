name: Plugin

# `coverage.yml` exercises the plugin only indirectly, through the KMP test
# rig's composite build, and never runs the plugin's or the agent's own unit
# tests. That is how a JUnit Platform misconfiguration that made
# `:omnivore-agent:test` fail to start went unnoticed.

on:
  push:
    branches: [main]
    paths:
      - 'coverage-plugin/**'
      - '.github/workflows/plugin.yml'
  pull_request:
    paths:
      - 'coverage-plugin/**'
      - '.github/workflows/plugin.yml'

defaults:
  run:
    working-directory: coverage-plugin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-test-reports
          path: coverage-plugin/*/build/reports/tests/
