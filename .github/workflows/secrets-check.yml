name: Secrets check

# Project gradle.properties files are committed (the Android rig needs its
# build flags tracked), so a dashboard API key added to one for local testing
# would be committed with it. Keys belong in ~/.gradle/gradle.properties or
# OMNIVORE_API_KEY.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No Omnivore API keys in tracked files
        run: |
          if git grep -nE 'omnivore\.apiKey[[:space:]]*=[[:space:]]*[^[:space:]]|omni_[A-Za-z0-9]{16,}' -- ':!*.md'; then
            echo "::error::Omnivore API key found in a tracked file. Move it to ~/.gradle/gradle.properties or OMNIVORE_API_KEY."
            exit 1
          fi
