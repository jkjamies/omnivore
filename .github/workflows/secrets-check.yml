name: Secrets check

# Preventive guard. Project-level gradle.properties files are tracked (the
# Android rig needs its build flags in git), so if someone ever puts a dashboard
# API key in one for local testing, this fails the build before it can merge.
# Local keys belong in ~/.gradle/gradle.properties or OMNIVORE_API_KEY.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No Omnivore API keys in tracked files
        run: |
          if git grep -nE 'omnivore\.apiKey[[:space:]]*=[[:space:]]*[^[:space:]]|omni_[A-Za-z0-9]{16,}'; then
            echo "::error::Omnivore API key found in a tracked file. Move it to ~/.gradle/gradle.properties or OMNIVORE_API_KEY."
            exit 1
          fi
