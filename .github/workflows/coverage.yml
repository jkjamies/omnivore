name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Run tests and generate coverage
        working-directory: test-rigs/kmp-test-rig
        run: ./gradlew test omnivoreReport

      - name: Upload coverage to dashboard (main branch)
        if: github.ref == 'refs/heads/main' && vars.OMNIVORE_DASHBOARD_URL != ''
        working-directory: test-rigs/kmp-test-rig
        env:
          DASHBOARD_URL: ${{ vars.OMNIVORE_DASHBOARD_URL }}
        run: |
          curl -sS --fail-with-body -X POST \
            "$DASHBOARD_URL/api/v1/ingest/coverage" \
            -H "Content-Type: application/json" \
            -d @build/reports/omnivore/omnivore-report.json

      - name: Upload coverage with PR comment
        if: github.event_name == 'pull_request' && vars.OMNIVORE_DASHBOARD_URL != ''
        working-directory: test-rigs/kmp-test-rig
        env:
          DASHBOARD_URL: ${{ vars.OMNIVORE_DASHBOARD_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The workflow token is sent to this URL, and OMNIVORE_DASHBOARD_URL
          # is a repository *variable* — a weaker permission to edit than a
          # secret. Require HTTPS and, when OMNIVORE_DASHBOARD_HOST is set,
          # pin the host, so nobody can redirect the token by editing a
          # variable.
          case "$DASHBOARD_URL" in
            https://*) ;;
            *) echo "::error::OMNIVORE_DASHBOARD_URL must be https:// to receive the workflow token"; exit 1 ;;
          esac
          EXPECTED_HOST="${{ vars.OMNIVORE_DASHBOARD_HOST }}"
          if [ -n "$EXPECTED_HOST" ]; then
            ACTUAL_HOST=$(printf '%s' "$DASHBOARD_URL" | sed -E 's#^https://([^/]+).*#\1#')
            if [ "$ACTUAL_HOST" != "$EXPECTED_HOST" ]; then
              echo "::error::Dashboard host '$ACTUAL_HOST' does not match pinned '$EXPECTED_HOST'"
              exit 1
            fi
          fi

          curl -sS --fail-with-body -X POST \
            "$DASHBOARD_URL/api/v1/ingest/coverage?github_repo=$REPO&pr_number=$PR_NUMBER&base_branch=main" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Token: $GH_TOKEN" \
            -d @build/reports/omnivore/omnivore-report.json

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: omnivore-coverage-report
          path: test-rigs/kmp-test-rig/build/reports/omnivore/
