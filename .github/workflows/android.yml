name: Android

# The AGP build-time transform is the only instrumentation path that no other
# job reaches. `plugin.yml` compiles it; `coverage.yml` runs the *JVM agent*
# through the KMP rig. Neither one ever asks real AGP to load
# `OmnivoreClassVisitorFactory` and hand it a class.
#
# That mattered: the build-time path had drifted from the agent's — it ignored
# `switch` statements entirely and sized every probe array at a hardcoded 1024,
# so a large class would have thrown `ArrayIndexOutOfBoundsException` inside the
# app under test. The logic is now shared and unit-tested
# (`BuildTimeInstrumentationTest`), but unit tests use a stand-in for AGP. This
# job uses the real thing.
#
# No emulator: `omnivoreWriteBuildProbeMap` depends on AGP's ASM transform
# tasks, so building it runs the transform over every app class and writes the
# probe map it produced. If the transform fails to load, throws, or silently
# instruments nothing, that file is missing or empty.

on:
  push:
    branches: [main]
    paths:
      - 'coverage-plugin/**'
      - 'test-rigs/android-test-rig/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'coverage-plugin/**'
      - 'test-rigs/android-test-rig/**'
      - '.github/workflows/android.yml'

jobs:
  build-time-transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v6

      - name: Run the AGP bytecode transform
        working-directory: test-rigs/android-test-rig
        run: ./gradlew :app:omnivoreWriteBuildProbeMap --stacktrace

      - name: Check the transform actually instrumented something
        working-directory: test-rigs/android-test-rig
        run: |
          PROBES=build/omnivore/connectedAndroidTest/build-time.probes
          if [ ! -s "$PROBES" ]; then
            echo "::error::AGP transform produced no probe map at $PROBES."
            echo "Either OmnivoreClassVisitorFactory never ran, or it instrumented no classes."
            exit 1
          fi
          # Magic (8) + version (2) + at least one class entry.
          SIZE=$(wc -c < "$PROBES")
          if [ "$SIZE" -le 10 ]; then
            echo "::error::Probe map is header-only ($SIZE bytes) — no classes were instrumented."
            exit 1
          fi
          echo "Build-time probe map: $SIZE bytes"

      - name: Run unit tests and generate a report
        working-directory: test-rigs/android-test-rig
        run: ./gradlew testDebugUnitTest omnivoreReport --stacktrace

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-rig-output
          path: |
            test-rigs/android-test-rig/build/omnivore/
            test-rigs/android-test-rig/build/reports/omnivore/
